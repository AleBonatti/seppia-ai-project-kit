<!DOCTYPE html>
<html lang="en" data-theme="dark" data-sidebar="comfortable" data-density="cozy">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SeppiaCms</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ============ TOKENS ============ */
  :root {
    --accent: #66FF4C;
    --r: 12px;
    --r-sm: 9px;
  }
  html[data-theme="dark"] {
    --bg: #18181b;          /* gutter — same as sidebar */
    --sidebar: #18181b;
    --box: #09090b;         /* main content + cards */
    --panel: #18181b;       /* breadcrumb / pills */
    --surface-2: #1d1d20;   /* hover, subtle fills */
    --ink: #e7e3e4;
    --muted: #a1a1aa;
    --faint: #71717a;
    --border: #232327;
    --border-soft: #1c1c20;
    --accent-ink: #06210a;
    --ph: #0e0e11;
    --field: #18181b;
    --field-border: #3f3f47;
    --selected: #f5f4f4;
    --shadow: 0 16px 40px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  html[data-theme="light"] {
    --bg: #F4F4F5;
    --sidebar: #F4F4F5;
    --box: #FFFFFF;
    --panel: #F4F4F5;
    --surface-2: #ECECEE;
    --ink: #2a2627;
    --muted: #71717a;
    --faint: #a1a1aa;
    --border: #F1F1F2;
    --border-soft: #F4F4F5;
    --accent-ink: #0c2a05;
    --ph: #FAFAFA;
    --field: #FAFAFA;
    --field-border: #d4d4d8;
    --selected: #0b0809;
    --shadow: 0 16px 40px -16px rgba(40,38,39,.22);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Google Sans', 'Google Sans Text', 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }
  .mono { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
  h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -0.02em; color: var(--selected); }

  /* ============ SHELL ============ */
  #app { height: 100%; }
  .shell { display: grid; grid-template-columns: var(--sb-w) 1fr; height: 100vh; transition: grid-template-columns .3s cubic-bezier(.4, 0, .2, 1); }
  html[data-sidebar="comfortable"] { --sb-w: 256px; }
  html[data-sidebar="compact"]     { --sb-w: 212px; }
  html[data-sidebar="icononly"]    { --sb-w: 62px; }
  html[data-density="cozy"]    { --pad: 22px; --row-h: 60px; --gap: 18px; }
  html[data-density="compact"] { --pad: 16px; --row-h: 48px; --gap: 12px; }

  /* ============ SIDEBAR ============ */
  .sidebar {
    background: var(--sidebar);
    display: flex; flex-direction: column;
    padding: 18px 11px; gap: 4px; overflow: visible; position: relative;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; }
  .brand .mark {
    width: 34px; height: 34px; flex: none; display: grid; place-items: center;
    color: var(--accent);
  }
  .brand .mark-svg { width: 100%; height: 100%; display: block; fill: currentColor; }
  .brand .name { font-weight: 600; font-size: 24px; white-space: nowrap; letter-spacing: -0.03em; }
  html[data-sidebar="icononly"] .brand .name { display: none; }
  .sb-toggle {
    margin-left: auto; flex: none; width: 30px; height: 30px;
    display: grid; place-items: center; cursor: pointer;
    background: transparent; color: var(--muted); border: none; border-radius: 8px;
  }
  .sb-toggle:hover { background: var(--surface-2); color: var(--ink); }
  html[data-sidebar="icononly"] .brand { flex-direction: column; gap: 14px; padding: 6px 0 18px; }
  html[data-sidebar="icononly"] .brand .mark { display: none; }
  html[data-sidebar="icononly"] .sb-toggle { margin-left: 0; }

  .group-label {
    font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
    color: var(--faint); padding: 16px 12px 7px; white-space: nowrap; overflow: hidden;
  }
  html[data-sidebar="icononly"] .group-label { padding: 0; margin: 15px 14px 8px; height: 1px; }
  html[data-sidebar="icononly"] .group-label .gl-text { display: none; }
  html[data-sidebar="icononly"] .group-label::after { content: ''; display: block; height: 1px; background: color-mix(in srgb, var(--faint) 42%, transparent); }

  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 12px; border-radius: var(--r-sm);
    color: var(--muted); cursor: pointer; white-space: nowrap;
    background: transparent; border: none; width: 100%; text-align: left;
    font-family: inherit; font-size: 14.5px; font-weight: 500;
    transition: background .14s ease, color .14s ease;
    position: relative;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.active { color: var(--selected); background: var(--surface-2); font-weight: 600; }
  .nav-item.active::before {
    content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px;
    background: var(--accent); border-radius: 0 3px 3px 0;
  }
  .nav-item .ico { flex: none; display: grid; place-items: center; }
  .nav-item.active .ico { color: var(--selected); }
  .nav-item .lbl { flex: 1; white-space: nowrap; overflow: hidden; }
  html[data-sidebar="icononly"] .nav-item { justify-content: center; padding: 11px 0; }  html[data-sidebar="icononly"] .nav-item .lbl,
  html[data-sidebar="icononly"] .nav-item .pill { display: none; }
  .pill {
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    background: var(--surface-2); color: var(--muted);
    padding: 1px 8px; border-radius: 20px; min-width: 24px; text-align: center;
  }
  .nav-item.active .pill { background: var(--accent); color: var(--accent-ink); }

  /* user card + menu */
  .sb-foot { margin-top: auto; padding-top: 12px; }
  .usercard-wrap { position: relative; overflow: hidden; }
  .usercard {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px; cursor: pointer; background: transparent;
    border: 1px solid var(--border); border-radius: var(--r); text-align: left;
    color: var(--ink); font-family: inherit; transition: background .14s ease;
  }
  .usercard:hover { background: var(--surface-2); }
  .usercard .uname { display: flex; flex-direction: column; flex: 1; min-width: 0; line-height: 1.25; }
  .usercard .uname b { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .usercard .uname span { font-size: 11.5px; color: var(--muted); }
  .uc-caret { color: var(--muted); flex: none; transition: transform .18s ease; }
  .usercard.open .uc-caret { transform: rotate(180deg); }
  html[data-sidebar="icononly"] .usercard { justify-content: center; align-items: center; width: 40px; height: 40px; padding: 0; margin: 0 auto; box-sizing: border-box; }
  html[data-sidebar="icononly"] .usercard .avatar { width: 24px !important; height: 24px !important; font-size: 10px !important; }
  html[data-sidebar="icononly"] .usercard .uname, html[data-sidebar="icononly"] .usercard .uc-caret { display: none; }

  .um-overlay { position: fixed; inset: 0; z-index: 55; }
  .um-panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 60;
    display: flex; flex-direction: column; border-radius: var(--r);
    background: transparent; border: 1px solid transparent; box-shadow: none;
    transform: translateY(var(--um-body-h, 264px));
    transition: transform .34s cubic-bezier(.22,.61,.36,1), background .24s ease, border-color .24s ease, box-shadow .24s ease;
    will-change: transform;
  }
  .um-panel.open {
    transform: translateY(0);
    background: var(--box); border-color: var(--border); box-shadow: var(--shadow);
  }
  @media (prefers-reduced-motion: reduce) { .um-panel { transition: background .2s ease, border-color .2s ease, box-shadow .2s ease; } }
  .um-panel .usercard { border-radius: var(--r); background: var(--box); border: 1px solid var(--border); }
  .um-panel.open .usercard { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-color: transparent; }
  .um-panel .usercard:hover { background: var(--box); }
  .um-panel .usercard:hover .uc-caret, .um-panel .usercard:hover .uname span { color: var(--ink); }
  .um-body { display: flex; flex-direction: column; gap: 3px; padding: 4px 8px 8px; border-top: 1px solid transparent; }
  .um-panel.open .um-body { border-top-color: var(--border); }
  .um-panel:not(.open) .um-body { pointer-events: none; }
  html[data-sidebar="icononly"] .um-panel.open { right: auto; width: 234px; }
  .um-seg { display: flex; gap: 5px; padding: 4px 0 4px; }
  .um-seg button {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px; background: transparent; color: var(--muted); cursor: pointer;
    border: 1px solid var(--border); border-radius: var(--r-sm); font-family: inherit; font-size: 13px; font-weight: 500;
  }
  .um-seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .um-sep { height: 1px; background: var(--border); margin: 5px 0; }
  .um-item {
    display: flex; align-items: center; gap: 11px; padding: 9px 8px;
    background: transparent; border: none; color: var(--ink); cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 500; border-radius: var(--r-sm); text-align: left; white-space: nowrap;
  }
  .um-item:hover { background: var(--surface-2); }
  .um-item .ico { color: var(--muted); }

  /* ============ MAIN ============ */
  .main { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .content { padding: 13px 8px 13px 0; overflow: hidden; flex: 1; min-height: 0; }
  .pagebox {
    max-width: none; margin: 0; background: var(--box);
    border-radius: 16px; padding: 13px; height: 100%;
    overflow-y: auto;
  }
  .view-anim { animation: viewIn .28s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) { .view-anim { animation: none; } }
  .crumbbar {
    position: sticky; top: 0; z-index: 20;
    margin-bottom: 13px;
    background: color-mix(in srgb, var(--panel) 72%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-radius: 8px; padding: 11px 16px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .cb-item { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
  .cb-item.cur { color: var(--ink); font-weight: 600; }
  .cb-item .ico { color: var(--faint); }
  .cb-item.cur .ico { color: var(--accent); }
  .cb-sep { color: var(--faint); }

  /* page header */
  .page-head { display: flex; align-items: center; gap: 16px; margin-bottom: var(--gap); flex-wrap: wrap; }
  .page-head h1 { font-size: 20px; white-space: nowrap; }
  .page-head .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .page-head > div:first-child { min-width: 0; }
  .head-actions { margin-left: auto; display: flex; gap: 9px; flex: none; }

  /* buttons */
  .btn {
    font-family: inherit; font-size: 13.5px; font-weight: 500;
    padding: 9px 15px; background: var(--box); color: var(--ink);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    transition: background .14s ease, border-color .14s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { filter: brightness(.94); background: var(--accent); }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); }

  .icon-btn {
    width: 36px; height: 36px; flex: none; display: grid; place-items: center;
    background: transparent; color: var(--muted); cursor: pointer;
    border: 1px solid transparent; border-radius: var(--r-sm); transition: background .14s ease, color .14s ease;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn.bordered { border-color: var(--border); }

  /* cards / grid */
  .card { background: var(--box); border: 1px solid var(--border); border-radius: var(--r); padding: var(--pad); }
  .grid { display: grid; gap: var(--gap); }

  /* list container: header + toolbar + table + footer all in one card */
  .list-card { padding: 0; overflow: hidden; }
  .lc-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 15px var(--pad); }
  .lc-head h1 { font-size: 20px; white-space: nowrap; }
  .lc-head .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .lc-actions { margin-left: auto; display: flex; gap: 9px; flex: none; }
  .lc-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 15px var(--pad); }
  .lc-table { padding: 2px var(--pad) 4px; }
  .lc-body { padding: 2px var(--pad) 10px; }
  .lc-table th:last-child, .lc-table td:last-child { padding-right: 0; }
  /* align the right-aligned Actions header over its icon-button glyphs (buttons are 34px wide) */
  .lc-table thead th:last-child { padding-right: 9px; }
  /* checkbox column: center the checkbox within its own cell */
  .lc-table .cb-cell { width: 44px; text-align: center; padding-left: 0; padding-right: 0; }
  .lc-table .cb-cell .check { display: inline-grid; }
  .lc-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 13px var(--pad); border-top: 1px solid var(--border); }

  .stat .stat-top { display: flex; align-items: center; justify-content: space-between; }
  .stat .label { font-size: 12.5px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .stat .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); }
  .stat .num { font-size: 30px; font-weight: 700; line-height: 1.1; margin: 14px 0 6px; letter-spacing: -0.03em; }
  .stat .delta { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .delta .up { color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
  .delta .pos { color: #16a34a; font-weight: 600; }
  html[data-theme="dark"] .delta .pos { color: var(--accent); }

  /* chart bits */
  .chart-card h3 { font-size: 16px; }
  .card h3 { white-space: nowrap; }
  .legend { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
  .legend-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 13px; }
  .legend-row + .legend-row { border-top: 1px solid var(--border); }
  .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }

  /* table */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    text-align: left; padding: 11px 14px; white-space: nowrap;
    background: var(--surface-2);
  }
  thead th:first-child { border-top-left-radius: 5px; border-bottom-left-radius: 5px; }
  thead th:last-child { border-top-right-radius: 5px; border-bottom-right-radius: 5px; }
  tbody td { padding: 0 14px; height: var(--row-h); vertical-align: middle; }
  tbody tr:first-child td { padding-top: 4px; }
  tbody tr + tr td { border-top: 1px solid var(--border); }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover { background: var(--surface-2); }
  .row-title { font-weight: 600; font-size: 14px; }
  .row-sub { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .badge {
    font-size: 11.5px; font-weight: 500; padding: 3px 10px 3px 8px; border-radius: 20px; white-space: nowrap;
    border: 1px solid var(--border); color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.pub { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
  html[data-theme="light"] .badge.pub { color: #15803d; }
  .badge.draft { color: var(--faint); }
  .badge.review { color: #d99a2b; border-color: color-mix(in srgb, #d99a2b 30%, var(--border)); }
  .badge.err { color: #e5484d; border-color: color-mix(in srgb, #e5484d 38%, var(--border)); }
  .badge.warn { color: #d99a2b; border-color: color-mix(in srgb, #d99a2b 34%, var(--border)); }
  .badge.info { color: var(--muted); }
  .logcode { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); flex: none; }
  .logcount { font-size: 12.5px; color: var(--muted); }

  .check { width: 17px; height: 17px; border-radius: 5px; border: 1px solid var(--border); background: var(--box); display: inline-grid; place-items: center; color: transparent; cursor: pointer; }
  .check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* avatar */
  .avatar { border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 600; background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); overflow: hidden; }

  /* chips / filters */
  .chip {
    padding: 7px 13px; background: var(--box); color: var(--muted); cursor: pointer;
    border: 1px solid var(--border); border-radius: 20px; font-size: 13px; font-weight: 500;
    display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; transition: background .12s;
  }
  .chip:hover { background: var(--surface-2); }
  .chip.on { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .chip .ct { font-variant-numeric: tabular-nums; color: var(--faint); }

  /* search */
  .searchbox {
    display: flex; align-items: center; gap: 9px; flex: 1; max-width: 340px;
    padding: 9px 13px; color: var(--faint); background: var(--field);
    border: 1px solid var(--field-border); border-radius: 7px;
    white-space: nowrap; overflow: hidden; font-size: 13.5px;
  }

  /* pagination */
  .pag { display: flex; align-items: center; gap: 5px; }
  .pag .pg { min-width: 34px; height: 34px; padding: 0 6px; display: grid; place-items: center; cursor: pointer; background: var(--box); border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 13px; font-weight: 500; color: var(--muted); }
  .pag .pg:hover { background: var(--surface-2); color: var(--ink); }
  .pag .pg.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

  /* media */
  .media-card { padding: 9px; }
  .media-thumb {
    aspect-ratio: 4 / 3; border-radius: var(--r-sm); margin-bottom: 10px; position: relative; overflow: hidden;
    background: var(--ph); display: grid; place-items: center; color: var(--faint);
  }
  .media-thumb .kebab { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; display: grid; place-items: center; background: var(--box); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); opacity: 0; transition: opacity .14s; }
  .media-card:hover .kebab { opacity: 1; }
  .ftype { font-size: 11px; font-weight: 700; letter-spacing: .05em; margin-top: 8px; color: var(--muted); }

  /* edit-page media thumbnails */
  .edit-thumb { position: relative; aspect-ratio: 1 / 1; border-radius: var(--r-sm); background: var(--ph); border: 1px solid var(--border); display: grid; place-items: center; color: var(--faint); }
  .edit-thumb .thumb-x { position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; display: grid; place-items: center; background: var(--box); border: 1px solid var(--border); border-radius: 7px; color: var(--muted); cursor: pointer; }
  .edit-thumb .thumb-x:hover { color: #e5484d; border-color: color-mix(in srgb, #e5484d 40%, var(--border)); }
  .edit-thumb.add { border-style: dashed; cursor: pointer; }
  .edit-thumb.add:hover { border-color: var(--accent); color: var(--accent); }
  .dropzone { border: 1.5px dashed var(--border); border-radius: var(--r); padding: 26px 18px; display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center; color: var(--faint); background: var(--ph); cursor: pointer; transition: border-color .14s, color .14s; }
  .dropzone:hover { border-color: var(--accent); color: var(--muted); }
  .dropzone .dz-main { font-size: 13.5px; color: var(--muted); }
  .dropzone .dz-link { color: var(--accent); font-weight: 600; }

  /* forms */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); margin-bottom: 7px; }
  .input {
    padding: 10px 13px; background: var(--field); color: var(--ink); border: 1px solid var(--field-border);
    border-radius: 7px; min-height: 42px; display: flex; align-items: center; font-size: 13.5px;
  }
  .input.area { min-height: 150px; align-items: flex-start; color: var(--faint); }
  .input .ph-text, .ph-text { color: var(--faint); }
  .input.select { justify-content: space-between; cursor: pointer; }

  /* user-edit specific */
  .tabs { display: flex; gap: 6px; margin-bottom: var(--gap); flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .tab { padding: 9px 4px; margin-bottom: -1px; background: transparent; color: var(--muted); cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; border: none; border-bottom: 2px solid transparent; }
  .tab + .tab { margin-left: 14px; }
  .tab.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .sec-head { font-size: 17px; font-weight: 600; margin-bottom: 3px; }
  .sec-sub { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .frow { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; padding: 20px 0; align-items: start; }
  .frow + .frow { border-top: 1px solid var(--border); }
  .frow .flabel { font-weight: 600; font-size: 14px; padding-top: 9px; }
  .fhelp { color: var(--faint); font-size: 12.5px; margin-top: 7px; }
  .avatar-drop { width: 80px; height: 80px; flex: none; border-radius: 50%; background: var(--ph); display: grid; place-items: center; color: var(--faint); border: 1px solid var(--border); }
  .avatar-pic { width: 80px; height: 80px; flex: none; border-radius: 50%; overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); display: grid; place-items: center; font-weight: 600; font-size: 24px; letter-spacing: -0.01em; }
  .avatar-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* real form inputs (settings) */
  input.input { font-family: inherit; outline: none; width: 100%; appearance: none; }
  input.input::placeholder { color: var(--faint); }
  input.input:focus, .input.pwd:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--field-border)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
  .input.pwd { padding: 0 6px 0 13px; gap: 8px; }
  .input.pwd input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font: inherit; color: inherit; min-height: 40px; }
  .pwd-toggle { flex: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  .pwd-toggle:hover { background: var(--surface-2); color: var(--ink); }
  .pw-strength { display: flex; gap: 5px; margin-top: 9px; }
  .pw-bar { height: 4px; flex: 1; border-radius: 3px; background: var(--surface-2); transition: background .15s ease; }
  .pw-bar.on { background: var(--accent); }
  .save-bar { display: flex; align-items: center; gap: 12px; margin-top: var(--gap); padding-top: 18px; border-top: 1px solid var(--border); }

  .row { display: flex; align-items: center; gap: 12px; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .wrap { flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .anno { font-size: 12.5px; color: var(--faint); }

  /* tweak swatch */
  .acc-sw { width: 28px; height: 28px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
  .acc-sw.on { border-color: var(--ink); }

  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--faint); }
</style>
</head>
<body>
  <div id="app"></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="seppia-mark" viewBox="0 0 512 512"><path fill="currentColor" d="M455.6 349.2c-45.891-39.09-36.67-77.877-16.095-128.11C475.16 134.04 415.967 34.14 329.93 8.3C237.04-19.6 134.252 24.341 99.677 117.147a180.9 180.9 0 0 0-10.988 73.544c1.733 29.543 14.717 52.97 24.09 80.3c17.2 50.161-28.1 92.743-66.662 117.582c-46.806 30.2-36.319 39.857-8.428 41.858c23.378 1.68 44.478-4.548 65.265-15.045c9.2-4.647 40.687-18.931 45.13-28.588c-12.184 26.59-36.962 72.702-21.463 102.102c19.1 36.229 67.112-31.77 76.709-45.812c8.591-12.572 42.963-81.279 63.627-46.926c18.865 31.361 8.6 76.391 35.738 104.622c32.854 34.2 51.155-18.312 51.412-44.221c.163-16.411-6.1-95.852 29.9-59.944c21.421 21.381 52.905 71.181 88.561 67.023c38.736-4.516-22.123-67.967-28.262-78.695c5.393 4.279 53.665 34.128 53.818 9.52c.11-18.789-30.085-34.667-42.524-45.267"/></symbol></svg>

  <script>
    /* set theme/layout before first paint to avoid flash + transition on load */
    (function () {
      try {
        var d = document.documentElement;
        var t = localStorage.getItem('seppia-hf-theme'); if (t) d.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Hugeicons icon data (renders as SVG via our Icon component) -->
  <script type="module">
    import * as Huge from 'https://esm.sh/@hugeicons/core-free-icons@1.1.0';
    window.HUGE_NS = Huge;
    window.dispatchEvent(new Event('huge-ready'));
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="hf-shell.jsx"></script>
  <script type="text/babel" src="hf-pages.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "sidebar": "comfortable",
      "density": "cozy",
      "accent": "#66FF4C"
    }/*EDITMODE-END*/;

    const ACCENTS = [
      { id: "#66FF4C", name: "lime" },
      { id: "#2A6FDB", name: "blue" },
      { id: "#e88a6a", name: "coral" },
      { id: "#a78bfa", name: "violet" },
    ];

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [theme, setTheme] = useState(() => localStorage.getItem('seppia-hf-theme') || 'dark');
      const [page, setPage] = useState(() => localStorage.getItem('seppia-hf-page') || 'dashboard');
      const [, bump] = useState(0);

      useEffect(() => {
        const h = () => bump((x) => x + 1);
        window.addEventListener('huge-ready', h);
        if (window.HUGE_NS) h();
        return () => window.removeEventListener('huge-ready', h);
      }, []);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('seppia-hf-theme', theme);
      }, [theme]);
      useEffect(() => { localStorage.setItem('seppia-hf-page', page); }, [page]);
      useEffect(() => {
        document.documentElement.setAttribute('data-sidebar', t.sidebar);
        document.documentElement.setAttribute('data-density', t.density);
        document.documentElement.style.setProperty('--accent', t.accent);
      }, [t.sidebar, t.density, t.accent]);

      const Page = { dashboard: Dashboard, posts: PostsList, edit: EditPost, media: MediaLibrary, users: UsersList, useredit: UserEdit, settings: Settings, logs: ErrorLogs }[page] || Dashboard;

      return (
        <div className="shell">
          <Sidebar page={page} setPage={setPage} sidebar={t.sidebar} theme={theme} setTheme={setTheme}
            onToggleSidebar={() => setTweak('sidebar', t.sidebar === 'icononly' ? 'comfortable' : 'icononly')} />
          <div className="main">
            <div className="content">
              <div className="pagebox">
                <Breadcrumb page={page} />
                <div className="view-anim" key={page}>
                  <Page setPage={setPage} />
                </div>
              </div>
            </div>
          </div>

          <TweaksPanel>
            <TweakSection label="Sidebar" />
            <TweakRadio label="Width" value={t.sidebar}
              options={[{value:'comfortable',label:'Wide'},{value:'compact',label:'Compact'},{value:'icononly',label:'Icons'}]}
              onChange={(v) => setTweak('sidebar', v)} />
            <TweakSection label="Layout" />
            <TweakRadio label="Density" value={t.density}
              options={[{value:'cozy',label:'Cozy'},{value:'compact',label:'Compact'}]}
              onChange={(v) => setTweak('density', v)} />
            <TweakSection label="Accent" />
            <div className="row wrap" style={{padding:'2px 2px 4px'}}>
              {ACCENTS.map(a => (
                <div key={a.id} title={a.name}
                  className={"acc-sw" + (t.accent === a.id ? " on" : "")}
                  style={{background:a.id}}
                  onClick={() => setTweak('accent', a.id)} />
              ))}
            </div>
            <div className="anno" style={{padding:'0 2px'}}>Dark / light toggle is in the user menu (bottom-left).</div>
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
