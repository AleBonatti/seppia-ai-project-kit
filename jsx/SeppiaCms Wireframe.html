<!DOCTYPE html>
<html lang="en" data-theme="dark" data-sidebar="comfortable" data-density="cozy" data-sk="2">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SeppiaCms — Backoffice Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Patrick+Hand&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ============ THEME TOKENS ============ */
  :root {
    --accent: #6aa6e8;
    --radius: 12px;
  }
  html[data-theme="dark"] {
    --bg: #24262b;
    --box: #0e0f12;
    --panel: #24262b;
    --panel-2: #2c2e34;
    --panel-3: #34363c;
    --ink: #e9e9ec;
    --muted: #9a9ba3;
    --faint: #6c6d75;
    --stroke: var(--panel);
    --stroke-soft: var(--panel);
    --ph-a: #303237;
    --ph-b: #34363c;
    --accent-ink: #10131a;
    --shadow: 0 8px 26px rgba(0,0,0,.35);
  }
  html[data-theme="light"] {
    --bg: #fbfaf6;
    --box: #ffffff;
    --panel: #fbfaf6;
    --panel-2: #f2f0e8;
    --panel-3: #e7e4d7;
    --ink: #26261f;
    --muted: #6f6e64;
    --faint: #9d9c90;
    --stroke: #3b3a33;
    --stroke-soft: #d7d4c8;
    --ph-a: #eceabf0;
    --ph-a: #ecebe2;
    --ph-b: #e4e2d6;
    --accent-ink: #ffffff;
    --shadow: 0 8px 22px rgba(60,55,40,.12);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Patrick Hand', 'Segoe Print', cursive;
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }
  .mono { font-family: 'Spline Sans Mono', ui-monospace, monospace; }
  h1,h2,h3,h4 { font-family: 'Kalam', cursive; font-weight: 700; margin: 0; letter-spacing: .2px; }

  /* ============ SKETCH BORDER SYSTEM ============ */
  /* The visible stroke lives on a ::before layer so the displacement filter
     wobbles the border but never the text. */
  .sk { position: relative; border: none !important; background-clip: padding-box; }
  .sk::before {
    content: "";
    position: absolute; inset: 0;
    border: 2px solid var(--stroke);
    border-radius: 14px 11px 13px 10px;
    pointer-events: none;
    z-index: 0;
  }
  .sk > * { position: relative; z-index: 1; }
  body[data-sk="0"] .sk::before { filter: none; }
  body[data-sk="1"] .sk::before { filter: url(#sketch1); }
  body[data-sk="2"] .sk::before { filter: url(#sketch2); }
  body[data-sk="3"] .sk::before { filter: url(#sketch3); }
  .sk-soft::before { border-color: var(--stroke-soft); }
  .sk-thin::before { border-width: 1.5px; }

  /* placeholder hatch */
  .ph {
    background-image: repeating-linear-gradient(45deg, var(--ph-a), var(--ph-a) 7px, var(--ph-b) 7px, var(--ph-b) 14px);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    border-radius: 10px;
    text-align: center;
  }
  .tag { color: var(--faint); font-size: 12.5px; letter-spacing: .04em; }

  /* ============ APP SHELL GRID ============ */
  #app { height: 100%; }
  .shell { display: grid; grid-template-columns: var(--sb-w) 1fr; height: 100vh; }
  html[data-sidebar="comfortable"] { --sb-w: 248px; }
  html[data-sidebar="compact"]     { --sb-w: 208px; }
  html[data-sidebar="icononly"]    { --sb-w: 78px; }

  /* density */
  html[data-density="cozy"]    { --pad: 26px; --row-h: 56px; --gap: 22px; }
  html[data-density="compact"] { --pad: 16px; --row-h: 44px; --gap: 14px; }

  /* ============ SIDEBAR ============ */
  .sidebar {
    background: var(--panel);
    display: flex; flex-direction: column;
    padding: 20px 14px;
    gap: 8px;
    overflow: visible;
    position: relative;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 6px 8px 16px; }
  .brand .mark {
    width: 36px; height: 36px; flex: none; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink);
    font-family: 'Kalam', cursive; font-weight: 700; font-size: 19px;
  }
  .brand .mark::before { border-color: var(--ink); border-radius: 11px 9px 12px 8px; }
  .brand .name { font-family: 'Kalam', cursive; font-weight: 700; font-size: 22px; white-space: nowrap; }
  .sb-toggle {
    margin-left: auto; flex: none; width: 30px; height: 30px;
    display: grid; place-items: center; cursor: pointer;
    background: transparent; color: var(--muted); border-radius: 8px;
  }
  .sb-toggle:hover { background: var(--panel-2); color: var(--ink); }
  html[data-sidebar="icononly"] .brand { flex-direction: column; gap: 12px; padding: 6px 0 16px; }
  html[data-sidebar="icononly"] .sb-toggle { margin-left: 0; }
  html[data-sidebar="icononly"] .brand .name { display: none; }
  html[data-sidebar="icononly"] .group-label { text-align: center; }

  .group-label {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--faint); padding: 14px 12px 6px;
  }
  html[data-sidebar="icononly"] .group-label { font-size: 8px; padding: 12px 0 6px; }

  .nav-item {
    display: flex; align-items: center; gap: 13px;
    padding: 9px 12px; border-radius: 10px;
    color: var(--muted); cursor: pointer; white-space: nowrap;
    background: transparent; border: none; width: 100%; text-align: left;
    font-family: 'Patrick Hand', cursive; font-size: 17px;
    transition: background .15s ease, color .15s ease;
    position: relative;
  }
  .nav-item:hover { background: var(--panel-2); color: var(--ink); }
  .nav-item.active { color: var(--ink); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .nav-item.active::before {
    content: ""; position: absolute; left: -2px; top: 8px; bottom: 8px; width: 3px;
    background: var(--accent); border-radius: 3px; filter: url(#sketch1);
  }
  .nav-item .ico { flex: none; color: currentColor; }
  .nav-item .lbl { flex: 1; }
  html[data-sidebar="icononly"] .nav-item { justify-content: center; padding: 11px 0; }
  html[data-sidebar="icononly"] .nav-item .lbl,
  html[data-sidebar="icononly"] .nav-item .pill { display: none; }
  .pill {
    font-family: 'Spline Sans Mono', monospace; font-size: 11px;
    background: var(--panel-2); color: var(--muted);
    padding: 1px 8px; border-radius: 20px;
  }
  .sb-foot { margin-top: auto; padding-top: 12px; }
  .usercard-wrap { position: relative; }
  .usercard {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 8px 10px; cursor: pointer; background: var(--panel-2);
    border: none; border-radius: 12px; text-align: left; color: var(--ink);
    font-family: 'Patrick Hand', cursive;
  }
  .usercard:hover { filter: brightness(1.05); }
  .usercard .uname { display: flex; flex-direction: column; flex: 1; min-width: 0; line-height: 1.1; white-space: normal; }
  .usercard .uname b { font-family: 'Kalam', cursive; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .usercard .uname span { font-size: 12px; color: var(--muted); }
  .uc-caret { color: var(--muted); flex: none; transition: transform .15s ease; }
  .usercard.open .uc-caret { transform: rotate(180deg); }
  html[data-sidebar="icononly"] .usercard { justify-content: center; padding: 8px; }
  html[data-sidebar="icononly"] .usercard .uname,
  html[data-sidebar="icononly"] .usercard .uc-caret { display: none; }

  .um-overlay { position: fixed; inset: 0; z-index: 55; }
  .usermenu {
    position: absolute; bottom: calc(100% + 9px); left: 0; right: 0; min-width: 224px;
    background: var(--panel); padding: 12px; z-index: 60;
    display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow);
  }
  html[data-sidebar="icononly"] .usermenu { right: auto; width: 224px; }
  .um-label { font-family: 'Spline Sans Mono', monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 2px 4px 4px; }
  .um-seg { display: flex; gap: 6px; }
  .um-seg button {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px; background: var(--panel-2); color: var(--muted); cursor: pointer;
    border: none; border-radius: 9px; font-family: 'Patrick Hand', cursive; font-size: 14px;
  }
  .um-seg button.on { background: color-mix(in srgb, var(--accent) 20%, var(--panel-2)); color: var(--ink); }
  .um-sep { height: 1.5px; background: var(--stroke-soft); margin: 4px 0; }
  .um-item {
    display: flex; align-items: center; gap: 10px; padding: 8px;
    background: transparent; border: none; color: var(--ink); cursor: pointer;
    font-family: 'Patrick Hand', cursive; font-size: 15px; border-radius: 9px; text-align: left;
    white-space: nowrap;
  }
  .um-item:hover { background: var(--panel-2); }

  /* ============ MAIN ============ */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .crumbbar {
    background: var(--panel); padding: 12px 18px; border-radius: 12px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  }
  .cb-item { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 15px; white-space: nowrap; }
  .cb-item.cur { color: var(--ink); font-family: 'Kalam', cursive; font-weight: 700; }
  .cb-sep { color: var(--faint); font-family: 'Spline Sans Mono', monospace; }
  .icon-btn {
    width: 40px; height: 40px; flex: none; display: grid; place-items: center;
    background: transparent; color: var(--muted); cursor: pointer;
    border-radius: 10px;
  }
  .icon-btn:hover { background: var(--panel-2); color: var(--ink); }
  .searchbox {
    display: flex; align-items: center; gap: 10px; flex: 1; max-width: 360px;
    padding: 8px 14px; color: var(--faint); background: var(--box);
    white-space: nowrap; overflow: hidden;
  }
  .searchbox span { overflow: hidden; text-overflow: ellipsis; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: var(--ph-a); display: grid; place-items: center;
    font-family: 'Kalam', cursive; font-weight: 700; color: var(--ink);
    background-image: repeating-linear-gradient(45deg, var(--ph-a), var(--ph-a) 5px, var(--ph-b) 5px, var(--ph-b) 10px);
  }
  .avatar::before { border-radius: 50%; }
  .uname { line-height: 1.05; white-space: nowrap; }
  .uname b { font-family: 'Kalam', cursive; font-size: 16px; }
  .uname span { font-size: 12px; color: var(--muted); }

  .content { padding: var(--pad); overflow-y: auto; flex: 1; }
  .pagebox { max-width: 1180px; margin: 0 auto; background: var(--box); padding: 16px; border-radius: 12px; }
  .page { display: block; }

  /* page header */
  .page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: var(--gap); flex-wrap: wrap; }
  .page-head h1 { font-size: 30px; line-height: 1.15; white-space: nowrap; }
  .page-head > div:first-child { min-width: 0; }
  .crumb { font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: var(--faint); margin-bottom: 4px; white-space: nowrap; }
  .head-actions { margin-left: auto; display: flex; gap: 10px; flex: none; }

  /* buttons */
  .btn {
    font-family: 'Patrick Hand', cursive; font-size: 16px;
    padding: 9px 18px; background: var(--box); color: var(--ink);
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    white-space: nowrap;
  }
  .btn:hover { background: var(--panel-2); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary::before { border-color: var(--ink); }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-sm { padding: 5px 13px; font-size: 14px; }
  .btn-ghost { background: transparent; }

  /* cards */
  .card { background: var(--box); padding: var(--pad); }
  .grid { display: grid; gap: var(--gap); }
  .stat .label { font-family: 'Spline Sans Mono', monospace; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .stat .num { font-family: 'Kalam', cursive; font-weight: 700; font-size: 38px; line-height: 1.1; margin: 6px 0 2px; }
  .stat .delta { font-size: 14px; color: var(--muted); }
  .delta.up { color: color-mix(in srgb, var(--accent) 70%, var(--ink)); }

  /* table */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-family: 'Spline Sans Mono', monospace; font-weight: 500; font-size: 11.5px;
    letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
    text-align: left; padding: 4px 14px 14px; white-space: nowrap;
  }
  tbody td { padding: 0 14px; height: var(--row-h); vertical-align: middle; }
  tbody tr { position: relative; }
  tbody tr + tr td { border-top: 1.5px dashed var(--stroke-soft); }
  .badge {
    font-family: 'Spline Sans Mono', monospace; font-size: 11.5px;
    padding: 3px 11px; border-radius: 20px; white-space: nowrap;
    border: 1.5px solid var(--stroke-soft); color: var(--muted);
  }
  .badge.pub { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .check { width: 18px; height: 18px; border-radius: 5px; background: var(--panel-3); display: inline-block; }
  .check.on { background: var(--accent); }
  .row-title { font-family: 'Kalam', cursive; font-weight: 700; font-size: 17px; }
  .row-sub { font-size: 13px; color: var(--faint); }

  /* form */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-family: 'Spline Sans Mono', monospace; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .input { padding: 11px 14px; background: var(--box); color: var(--ink); min-height: 44px; display: flex; align-items: center; }
  .input.area { min-height: 150px; align-items: flex-start; color: var(--faint); }
  .input .ph-text { color: var(--faint); }
  .select { display: flex; align-items: center; justify-content: space-between; white-space: nowrap; }
  .pag { display: flex; align-items: center; gap: 6px; }
  .pag .pg { width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; background: var(--box); }
  .pag .pg.on { background: var(--accent); color: var(--accent-ink); }
  .chip { padding: 6px 13px; background: var(--box); color: var(--muted); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
  .chip.on { color: var(--ink); }

  /* user edit form */
  .tabs { display: flex; gap: 8px; margin-bottom: var(--gap); flex-wrap: wrap; }
  .tab { padding: 8px 18px; background: var(--box); color: var(--muted); cursor: pointer; font-family: 'Patrick Hand', cursive; font-size: 16px; }
  .tab.on { background: color-mix(in srgb, var(--accent) 22%, var(--box)); color: var(--ink); }
  .sec-head { font-family: 'Kalam', cursive; font-weight: 700; font-size: 23px; margin-bottom: 4px; }
  .sec-sub { color: var(--muted); margin-bottom: 6px; }
  .frow { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; padding: 20px 0; align-items: start; }
  .frow + .frow { border-top: 1.5px dashed var(--stroke-soft); }
  .frow .flabel { font-family: 'Kalam', cursive; font-weight: 700; font-size: 16px; padding-top: 10px; }
  .fhelp { color: var(--faint); font-size: 13.5px; margin-top: 8px; }
  .avatar-drop { width: 84px; height: 84px; flex: none; border-radius: 50%; }
  .save-bar { display: flex; align-items: center; gap: 12px; margin-top: var(--gap); padding-top: 18px; border-top: 1.5px dashed var(--stroke-soft); }

  .row { display: flex; align-items: center; gap: 12px; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .wrap { flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .spark { height: 30px; }
  .anno { font-family: 'Spline Sans Mono', monospace; font-size: 11px; color: var(--faint); }

  /* tweak swatch (custom inside panel) */
  .acc-sw { width: 30px; height: 30px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
  .acc-sw.on { border-color: var(--ink); }

  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: var(--stroke-soft); border-radius: 6px; border: 3px solid var(--bg); }
</style>
</head>
<body>
  <!-- hand-drawn displacement filters -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="sketch1"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/></filter>
    <filter id="sketch2"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/></filter>
    <filter id="sketch3"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4.2"/></filter>
  </svg>

  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="wf-shell.jsx"></script>
  <script type="text/babel" src="wf-pages.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "sidebar": "comfortable",
      "density": "cozy",
      "accent": "#e88a6a",
      "sketch": 2
    }/*EDITMODE-END*/;

    const ACCENTS = [
      { id: "#6aa6e8", name: "blueprint" },
      { id: "#e88a6a", name: "coral" },
      { id: "#74c69d", name: "sage" },
      { id: "#9a9ba3", name: "mono" },
    ];

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [theme, setTheme] = useState(() => localStorage.getItem('seppia-theme') || 'dark');
      const [page, setPage] = useState(() => localStorage.getItem('seppia-page') || 'dashboard');

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('seppia-theme', theme);
      }, [theme]);
      useEffect(() => { localStorage.setItem('seppia-page', page); }, [page]);

      useEffect(() => {
        document.documentElement.setAttribute('data-sidebar', t.sidebar);
        document.documentElement.setAttribute('data-density', t.density);
        document.body.setAttribute('data-sk', String(t.sketch));
        document.documentElement.style.setProperty('--accent', t.accent);
      }, [t.sidebar, t.density, t.accent, t.sketch]);

      const Page = { dashboard: Dashboard, posts: PostsList, edit: EditPost, media: MediaLibrary, users: UsersList, useredit: UserEdit }[page] || Dashboard;

      return (
        <div className="shell">
          <Sidebar page={page} setPage={setPage} sidebar={t.sidebar} theme={theme} setTheme={setTheme}
            onToggleSidebar={() => setTweak('sidebar', t.sidebar === 'icononly' ? 'comfortable' : 'icononly')} />
          <div className="main">
            <div className="content">
              <div className="pagebox">
                <Breadcrumb page={page} />
                <Page setPage={setPage} />
              </div>
            </div>
          </div>

          <TweaksPanel>
            <TweakSection label="Sidebar" />
            <TweakRadio label="Width" value={t.sidebar}
              options={[{value:'comfortable',label:'Wide'},{value:'compact',label:'Compact'},{value:'icononly',label:'Icons'}]}
              onChange={(v) => setTweak('sidebar', v)} />
            <TweakSection label="Layout" />
            <TweakRadio label="Density" value={t.density}
              options={[{value:'cozy',label:'Cozy'},{value:'compact',label:'Compact'}]}
              onChange={(v) => setTweak('density', v)} />
            <TweakSlider label="Sketchiness" value={t.sketch} min={0} max={3} step={1}
              onChange={(v) => setTweak('sketch', v)} />
            <TweakSection label="Accent" />
            <div className="row wrap" style={{padding:'2px 2px 4px'}}>
              {ACCENTS.map(a => (
                <div key={a.id} title={a.name}
                  className={"acc-sw" + (t.accent === a.id ? " on" : "")}
                  style={{background:a.id}}
                  onClick={() => setTweak('accent', a.id)} />
              ))}
            </div>
            <div className="anno" style={{padding:'0 2px'}}>Theme toggle (dark/light) lives in the top bar.</div>
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
