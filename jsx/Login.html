<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · SeppiaCms</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --accent: #66FF4C; }
  html[data-theme="dark"] {
    --bg: #09090b; --card: #18181b; --ink: #e7e3e4; --muted: #a1a1aa; --faint: #71717a;
    --border: #27272a; --field: #18181b; --accent-ink: #06210a; --mark: var(--accent);
    color-scheme: dark;
  }
  html[data-theme="light"] {
    --bg: #F4F4F5; --card: #FFFFFF; --ink: #2a2627; --muted: #71717a; --faint: #a1a1aa;
    --border: #E7E7E9; --field: #FAFAFA; --accent-ink: #0c2a05; --mark: #1c1c1f;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Google Sans','Google Sans Text','Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
    letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; min-height: 100%; padding: 32px;
    transition: background .25s, color .25s;
  }
  .card {
    width: 100%; max-width: 388px; background: var(--card); border: 1px solid var(--border);
    border-radius: 13px; padding: 34px 32px 30px; box-shadow: 0 24px 60px -24px rgba(0,0,0,.6);
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 30px; }
  .brand .mark { width: 46px; height: 46px; color: var(--mark); display: grid; place-items: center; }
  .brand .mark svg { width: 100%; height: 100%; fill: currentColor; display: block; }
  .brand .word { font-size: 40px; font-weight: 500; letter-spacing: -0.04em; }
  h1 { text-align: center; font-size: 23px; font-weight: 500; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .sub a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .sub a:hover { color: var(--accent); }

  .gbtn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 11px;
    padding: 13px; background: var(--field); color: var(--ink); border: 1px solid var(--border);
    border-radius: 7px; font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer;
    transition: background .14s, border-color .14s;
  }
  .gbtn:hover { border-color: var(--muted); }
  .gbtn svg { width: 19px; height: 19px; flex: none; }

  .divider { display: flex; align-items: center; gap: 14px; margin: 22px 0; color: var(--faint); font-size: 12px; letter-spacing: .08em; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .field { margin-bottom: 18px; }
  .field .lbl-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  label { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .forgot { white-space: nowrap; display: block; margin-top: 9px; text-align: right; }
  .forgot { font-size: 13px; color: var(--muted); text-decoration: none; }
  .forgot:hover { color: var(--accent); }
  .inwrap { position: relative; display: flex; align-items: center; }
  input[type=text], input[type=password] {
    width: 100%; padding: 14px 15px; background: var(--field); color: var(--ink);
    border: 1px solid #3f3f47; border-radius: 7px; font: inherit; font-size: 14.5px; outline: none;
    transition: border-color .14s, box-shadow .14s;
  }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .eye { position: absolute; right: 8px; width: 38px; height: 38px; display: grid; place-items: center; background: transparent; border: none; color: var(--muted); cursor: pointer; border-radius: 8px; }
  .eye:hover { color: var(--ink); }
  .eye svg { width: 20px; height: 20px; }

  .remember { display: flex; align-items: center; gap: 10px; margin: 4px 0 24px; cursor: pointer; user-select: none; font-size: 14px; }
  .remember input { position: absolute; opacity: 0; width: 0; height: 0; }
  .box { width: 20px; height: 20px; border-radius: 6px; border: 1px solid var(--border); background: var(--field); display: grid; place-items: center; color: transparent; flex: none; transition: background .12s, border-color .12s; }
  .remember input:checked + .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .box svg { width: 13px; height: 13px; }

  .submit {
    width: 100%; padding: 14px; background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 7px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; transition: filter .14s;
  }
  .submit:hover { filter: brightness(.94); }

  .themebtn { position: fixed; top: 18px; right: 18px; width: 40px; height: 40px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); cursor: pointer; }
  .themebtn:hover { color: var(--ink); }
  .themebtn svg { width: 19px; height: 19px; }
</style>
</head>

  <script type="module">
    import * as Huge from 'https://esm.sh/@hugeicons/core-free-icons@1.1.0';
    const NS = Huge;
    function draw(el, names, size){
      const name = names.find(n => NS[n]);
      if(!name) return;
      const data = NS[name];
      const ns='http://www.w3.org/2000/svg';
      const svg=document.createElementNS(ns,'svg');
      svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('fill','none');
      svg.setAttribute('stroke','currentColor'); svg.setAttribute('stroke-width','1.8');
      svg.setAttribute('stroke-linecap','round'); svg.setAttribute('stroke-linejoin','round');
      svg.style.width=size+'px'; svg.style.height=size+'px';
      for(const [tag,attrs] of data){ const e=document.createElementNS(ns,tag); for(const k in attrs){ if(k!=='key') e.setAttribute(k,attrs[k]); } svg.appendChild(e); }
      el.innerHTML=''; el.appendChild(svg);
    }
    const ICN = {
      sun:['Sun03Icon','Sun01Icon'], moon:['Moon02Icon','Moon01Icon'],
      eye:['ViewIcon','Eye01Icon'], eyeoff:['ViewOffIcon','ViewOffSlashIcon']
    };

    // theme
    const root = document.documentElement;
    const tbtn = document.getElementById('themeToggle');
    function setTheme(t){ root.setAttribute('data-theme',t); localStorage.setItem('seppia-hf-theme',t); draw(tbtn, t==='dark'?ICN.sun:ICN.moon, 19); }
    setTheme(localStorage.getItem('seppia-hf-theme')||'dark');
    tbtn.onclick = () => setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark');

    // password show/hide
    const eye = document.getElementById('eye');
    const pass = document.getElementById('pass');
    function paint(){ draw(eye, pass.type==='password'?ICN.eyeoff:ICN.eye, 20); }
    paint();
    eye.onclick = () => { pass.type = pass.type==='password'?'text':'password'; paint(); };
  </script>
